name: Product build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/products/product.py check android
      - run: python scripts/products/product.py prepare android --destination ../build-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'ndk;27.3.13750724'
      - run: pwsh -NoProfile -File ../build-source/scripts/dev/build.ps1 go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
      - run: pwsh -NoProfile -File ../build-source/scripts/dev/build.ps1 go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
      - run: pwsh -NoProfile -File ../build-source/scripts/mobile/build-core-android.ps1
      - run: gradle -p ../build-source/apps/client-android assembleDebug
